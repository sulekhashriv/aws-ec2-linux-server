<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS EC2 Linux Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4fa;

            <p>This website is hosted on an Amazon EC2 Linux server.</p>
